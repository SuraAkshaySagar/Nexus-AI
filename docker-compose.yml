version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-ai-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:////app/data/nexus_data.db
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-nexus_memory}
      - LYZR_API_KEY=${LYZR_API_KEY}
      - LYZR_AGENT_ID=${LYZR_AGENT_ID}
      - OMI_WEBHOOK_SECRET=${OMI_WEBHOOK_SECRET}
    volumes:
      - nexus-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexus-ai-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  nexus-data:
